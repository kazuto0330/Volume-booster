<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title id="welcomeTitle-tab">Volume Booster Welcome</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --text-color: #333;
      --title-color: #111;
      --card-bg: #ffffff;
      --accent-color: #007bff;
      --accent-hover: #0056b3;
      --border-color: #e1e4e8;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body.theme-dark {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --title-color: #ffffff;
      --card-bg: #1e1e1e;
      --accent-color: #4dabf7;
      --accent-hover: #339af0;
      --border-color: #333;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
      overflow-y: auto; /* Allow natural scrolling only when needed */
    }
    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      max-width: 800px;
      width: 100%;
      padding: 40px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      margin-bottom: 40px; /* Add margin to bottom to prevent container touching window edge when scrolling */
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      color: var(--title-color);
      font-size: 32px;
      margin: 0 0 10px 0;
    }
    .header p {
      font-size: 18px;
      color: var(--text-color);
      opacity: 0.8;
      margin: 0;
    }
    .section {
      margin-bottom: 40px;
    }
    .section-title {
      color: var(--accent-color);
      font-size: 24px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
    }
    .feature-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    .feature-list li {
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      font-size: 16px;
      line-height: 1.5;
    }
    .feature-list li::before {
      content: '✓';
      color: var(--accent-color);
      font-weight: bold;
      margin-right: 12px;
      font-size: 18px;
    }
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .feature-card {
      background-color: var(--bg-color);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .feature-card h3 {
      margin: 0 0 10px 0;
      color: var(--title-color);
      font-size: 18px;
    }
    .feature-card p {
      margin: 0;
      font-size: 14px;
      opacity: 0.8;
      line-height: 1.5;
    }
    .action-container {
      text-align: center;
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background-color: var(--border-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="welcomeTitle"></h1>
      <p id="welcomeSubtitle"></p>
    </div>

    <div class="section">
      <h2 class="section-title" id="welcomeSection1Title"></h2>
      <ul class="feature-list">
        <li id="welcomeSection1Desc1"></li>
        <li id="welcomeSection1Desc2"></li>
        <li id="welcomeSection1Desc3"></li>
      </ul>
    </div>

    <div class="section">
      <h2 class="section-title" id="welcomeSection2Title"></h2>
      <p style="margin-bottom: 20px; font-size: 16px; line-height: 1.5;" id="welcomeSection2Intro"></p>
      
      <div class="feature-grid">
        <div class="feature-card">
          <h3 id="welcomeFeature1Title"></h3>
          <p id="welcomeFeature1Desc"></p>
        </div>
        <div class="feature-card">
          <h3 id="welcomeFeature2Title"></h3>
          <p id="welcomeFeature2Desc"></p>
        </div>
        <div class="feature-card">
          <h3 id="welcomeFeature3Title"></h3>
          <p id="welcomeFeature3Desc"></p>
        </div>
      </div>
    </div>

    <div class="action-container">
      <button class="btn" id="getStartedBtn"></button>
      <button class="btn btn-secondary" id="openOptionsBtn"></button>
    </div>
  </div>

  <script src="strings.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
